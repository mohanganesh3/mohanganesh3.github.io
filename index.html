<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="referrer" content="no-referrer" />
  <title>Private</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F3F1EA; color: #141414; font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    main { width: min(30rem, calc(100vw - 2.5rem)); }
    h1 { margin: 0 0 0.4rem; font-size: 2rem; letter-spacing: -0.03em; }
    p { margin: 0 0 1.4rem; color: #5A5853; }
    form { display: grid; grid-template-columns: 1fr auto; border: 1.5px solid #141414; background: #fff; }
    input { border: 0; padding: 0.85rem 1rem; font: 16px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 0.04em; min-width: 0; background: transparent; }
    input:focus { outline: none; }
    form:focus-within { box-shadow: 0 0 0 3px #FF5A1F; }
    button { border: 0; border-left: 1.5px solid #141414; padding: 0 1.3rem; background: #141414; color: #F3F1EA; font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: progress; }
    #status { min-height: 1.5rem; margin-top: 0.9rem; font-size: 15px; color: #5A5853; }
    #status.err { color: #B33B0A; }
  </style>
</head>
<body>
  <main>
    <h1>Private site</h1>
    <p>Enter the access token you were sent.</p>
    <form id="f" autocomplete="off">
      <input id="t" type="password" name="token" aria-label="Access token" placeholder="XXXXXX-XXXXXX-XXXXXX-XXXXXX" spellcheck="false" autocapitalize="characters" required />
      <button id="b" type="submit">Open</button>
    </form>
    <div id="status" role="status" aria-live="polite"></div>
  </main>
  <script>
    (function () {
      var form = document.getElementById("f"), input = document.getElementById("t"), button = document.getElementById("b"), status = document.getElementById("status");
      if (location.pathname !== "/" && location.pathname !== "/index.html") sessionStorage.setItem("sealed-next", location.pathname + location.search + location.hash);
      var say = function (text, err) { status.textContent = text; status.className = err ? "err" : ""; };
      if (!("serviceWorker" in navigator) || !window.caches || !window.crypto || !crypto.subtle || !window.DecompressionStream) {
        say("This browser can't open the site. Please use a current Chrome, Edge, Firefox or Safari window (not a private one).", true);
        button.disabled = true;
        return;
      }
      async function open(token) {
        var res = await fetch("/bundle.bin", { cache: "no-store" });
        if (!res.ok) throw new Error("missing");
        var buf = new Uint8Array(await res.arrayBuffer());
        if (String.fromCharCode.apply(null, buf.slice(0, 5)) !== "SEAL1") throw new Error("format");
        var iterations = new DataView(buf.buffer, 5, 4).getUint32(0);
        var salt = buf.slice(9, 25), iv = buf.slice(25, 37), cipher = buf.slice(37);
        var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(token), "PBKDF2", false, ["deriveKey"]);
        var key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: salt, iterations: iterations, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
        var plain;
        try { plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, cipher); }
        catch (e) { var bad = new Error("token"); bad.token = true; throw bad; }
        var data = new Uint8Array(await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer());
        var headLen = new DataView(data.buffer).getUint32(0);
        var index = JSON.parse(new TextDecoder().decode(data.subarray(4, 4 + headLen)));
        var body = 4 + headLen;
        say("Opening…");
        await caches.delete("sealed-site");
        var cache = await caches.open("sealed-site");
        await Promise.all(index.map(function (f) {
          return cache.put(new Request(f.p), new Response(data.slice(body + f.o, body + f.o + f.n), { headers: { "Content-Type": f.t } }));
        }));
        await cache.put(new Request("/__sealed__"), new Response(String(Date.now())));
        await navigator.serviceWorker.register("/sw.js", { scope: "/" });
        await navigator.serviceWorker.ready;
        var next = sessionStorage.getItem("sealed-next") || "/";
        sessionStorage.removeItem("sealed-next");
        location.replace(next);
      }
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var token = input.value.trim().toUpperCase();
        if (!token) return;
        button.disabled = true;
        say("Checking the token…");
        open(token).catch(function (err) {
          button.disabled = false;
          say(err && err.token ? "That token didn't work. Check it and try again." : "Something went wrong while opening the site. Please reload and try again.", true);
          input.select();
        });
      });
    })();
  </script>
</body>
</html>
